# cargo-dist workspace configuration (Phase 6).
# https://opensource.axo.dev/cargo-dist/

[workspace]
members = ["cargo:."]

# Config for 'cargo dist'
[dist]
# The preferred cargo-dist version to use in CI
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Publish jobs to run in CI
# github-releases is automatic when ci = github and tags are pushed
# Releases are cut from tags only; a PR builds nothing. CI already covers PRs.
pr-run-mode = "skip"
# Whether to consider the binaries as needing a built dependency on glibc
unix-archive = ".tar.gz"
windows-archive = ".zip"
