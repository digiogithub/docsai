# cargo-dist workspace configuration (Phase 6).
# https://opensource.axo.dev/cargo-dist/

[workspace]
members = ["cargo:."]

# Config for 'cargo dist'
[dist]
# The preferred cargo-dist version to use in CI
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Sign the binaries before the release is created. dist has no code-signing of
# its own, so each job reopens the finished archives, signs the binaries inside
# them and puts them back: macOS with the Developer ID identity plus
# notarization (needs the MACOS_SIGNING_BUNDLE secret), Windows with Azure
# Trusted Signing (needs no secret — OIDC from the `release` environment).
# sign-windows runs after sign-macos; see docs/release-signing.md.
host-jobs = ["./sign-macos", "./sign-windows"]

# Publish jobs to run in CI
# github-releases is automatic when ci = github and tags are pushed
# Releases are cut from tags only; a PR builds nothing. CI already covers PRs.
pr-run-mode = "skip"
# Whether to consider the binaries as needing a built dependency on glibc
unix-archive = ".tar.gz"
windows-archive = ".zip"
