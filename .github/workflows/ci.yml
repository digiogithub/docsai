name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite itself lives in `test.yml` so a tag push runs the same one before
  # `release.yml` builds anything.
  test:
    uses: ./.github/workflows/test.yml
